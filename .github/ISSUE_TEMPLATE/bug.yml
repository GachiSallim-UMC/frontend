name: '🐛 Bug'
description: '버그 리포트'
title: 'fix: '
labels: ['bug']
body:
  - type: textarea
    attributes:
      label: 🐛 현상
      description: 어떤 문제가 발생하나요?
      placeholder: 무엇이 잘못 동작하는지 적어주세요.
    validations:
      required: true
  - type: textarea
    attributes:
      label: 🔁 재현 방법
      description: 문제를 재현하는 순서를 적어주세요.
      placeholder: |
        1. ~ 화면 진입
        2. ~ 클릭
        3. 오류 발생
    validations:
      required: true
  - type: textarea
    attributes:
      label: ✅ 기대 동작
      description: 원래 어떻게 동작해야 하나요?
  - type: input
    attributes:
      label: 🖥️ 환경
      description: 브라우저 / OS / 화면 크기 등
      placeholder: 'Chrome 120, Windows 11, 1440px'
  - type: textarea
    attributes:
      label: 📸 스크린샷 / 콘솔 로그
      description: 필요시 첨부해 주세요.
