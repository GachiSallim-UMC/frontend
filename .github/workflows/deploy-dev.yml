name: Deploy Dev

on:
  push:
    branches: [develop]

# GitHub OIDC로 AWS 역할을 assume하기 위해 필요. 정적 액세스 키는 쓰지 않는다.
permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  deploy:
    name: dev 배포
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 린트
        run: npm run lint

      - name: AWS 자격 증명 설정 (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/gha-deploy-dev
          aws-region: ${{ vars.AWS_REGION }}

      - name: SSM에서 빌드 환경변수 로드
        run: |
          # 필수 값: 없으면 앱이 정상 동작하지 않으므로 빌드를 실패시킨다.
          for NAME in VITE_API_BASE_URL VITE_COGNITO_DOMAIN_URL VITE_COGNITO_CLIENT_ID VITE_COGNITO_REDIRECT_URI VITE_COGNITO_LOGOUT_URI; do
            VALUE=$(aws ssm get-parameter --name "/gachi-salim/dev/${NAME}" --query 'Parameter.Value' --output text)
            if [ -z "$VALUE" ]; then
              echo "::error::${NAME} 파라미터 값이 비어있음"
              exit 1
            fi
            echo "${NAME}=${VALUE}" >> .env
          done

          # 선택 값: 미설정 시 앱이 해당 기능만 no-op으로 우회하므로 없어도 빌드는 계속 진행한다.
          for NAME in VITE_WS_URL VITE_VAPID_PUBLIC_KEY; do
            VALUE=$(aws ssm get-parameter --name "/gachi-salim/dev/${NAME}" --query 'Parameter.Value' --output text 2>/dev/null || true)
            if [ -n "$VALUE" ] && [ "$VALUE" != "None" ]; then
              echo "${NAME}=${VALUE}" >> .env
            fi
          done

      - name: 빌드 (타입 체크 포함 — npm run build가 tsc -b를 실행함)
        run: npm run build

      - name: S3 동기화
        run: aws s3 sync dist/ "s3://${{ vars.DEV_BUCKET_NAME }}" --delete

      - name: CloudFront 캐시 무효화
        run: aws cloudfront create-invalidation --distribution-id "${{ vars.DEV_DISTRIBUTION_ID }}" --paths "/index.html"
