name: Rollback Prod

# 승격에 수동 승인 게이트가 없어서 생긴 리스크에 대한 안전장치.
# 이전 색의 S3 콘텐츠는 배포 시 지우지 않으므로, primary distribution의
# origin path만 이전 색으로 되돌리면 즉시 원복된다 (재배포/재빌드 불필요).
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: '정말 롤백하려면 "ROLLBACK"을 정확히 입력하세요'
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  rollback:
    name: prod 롤백
    runs-on: ubuntu-latest
    environment: prod
    if: inputs.confirm == 'ROLLBACK'
    steps:
      - name: AWS 자격 증명 설정 (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/gha-deploy-prod
          aws-region: ${{ vars.AWS_REGION }}

      - name: 현재 활성 색 조회 및 롤백 대상 색 계산
        run: |
          CURRENT_COLOR=$(aws ssm get-parameter --name "/gachi-salim/prod/active-color" --query 'Parameter.Value' --output text)
          if [ "$CURRENT_COLOR" = "blue" ]; then
            ROLLBACK_COLOR="green"
          else
            ROLLBACK_COLOR="blue"
          fi
          echo "현재: ${CURRENT_COLOR} → 롤백 대상: ${ROLLBACK_COLOR}"
          echo "ROLLBACK_COLOR=${ROLLBACK_COLOR}" >> "$GITHUB_ENV"

      - name: primary distribution origin path를 이전 색으로 되돌리기
        run: |
          PRIMARY_ID="${{ vars.PROD_PRIMARY_DISTRIBUTION_ID }}"
          aws cloudfront get-distribution-config --id "$PRIMARY_ID" > /tmp/primary-config.json
          ETAG=$(jq -r '.ETag' /tmp/primary-config.json)
          jq --arg path "/${ROLLBACK_COLOR}" '.DistributionConfig.Origins.Items[0].OriginPath = $path | .DistributionConfig' /tmp/primary-config.json > /tmp/primary-new-config.json
          aws cloudfront update-distribution --id "$PRIMARY_ID" --if-match "$ETAG" --distribution-config file:///tmp/primary-new-config.json

      - name: 캐시 무효화
        run: aws cloudfront create-invalidation --distribution-id "${{ vars.PROD_PRIMARY_DISTRIBUTION_ID }}" --paths "/*"

      - name: 활성 색 원복
        run: |
          aws ssm put-parameter --name "/gachi-salim/prod/active-color" --value "${ROLLBACK_COLOR}" --type String --overwrite
          echo "롤백 완료: 활성 색 = ${ROLLBACK_COLOR}"
